<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Acme Enterprise Workspace &mdash; Sencha ExtJS Modern Toolkit</title>

    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Sencha ExtJS Modern Material Theme CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/extjs/6.2.0/modern/theme-material/resources/theme-material-all.css">

    <!-- Custom Enterprise Workspace Enhancements -->
    <link rel="stylesheet" href="./resources/css/custom.css">

    <style>
        #app-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a222d;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            transition: opacity 0.4s ease;
        }
        .loader-logo {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #1976d2, #00b0ff);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 176, 255, 0.4);
        }
        .loader-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255, 255, 255, 0.15);
            border-top-color: #00b0ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-top: 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="app-loader">
        <div class="loader-logo">A</div>
        <h2 style="margin: 0; font-size: 20px; font-weight: 700; letter-spacing: 0.5px;">Acme Enterprise Workspace</h2>
        <p style="margin: 6px 0 0 0; font-size: 13px; color: #94a3b8;">Bootstrapping ExtJS Modern Toolkit MVVM Architecture...</p>
        <div class="loader-spinner"></div>
    </div>

    <!-- Sencha ExtJS Modern Toolkit Core -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/extjs/6.2.0/ext-modern-all.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/extjs/6.2.0/modern/theme-material/theme-material.js"></script>

    <!-- Configure Class Loader & Bootstrap -->
    <script>
        Ext.Loader.setConfig({
            enabled: true,
            paths: {
                'ModernAdmin': './app'
            }
        });

        // Hide splash loader once ExtJS Application is ready
        Ext.onReady(function() {
            var loader = document.getElementById('app-loader');
            if (loader) {
                loader.style.opacity = '0';
                setTimeout(function() {
                    loader.style.display = 'none';
                }, 400);
            }
        });
    </script>

    <!-- Application Bootstrapper -->
    <script src="./app.js"></script>
</body>
</html>
